name: Integrate customer journey on isolated branch
on:
  push:
    branches: [feat/customer-journey-hig]
permissions:
  contents: write
concurrency:
  group: customer-journey-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/customer-journey-hig'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: demo-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-accel-journey.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-accel-journey
      VITE_FIREBASE_STORAGE_BUCKET: demo-accel-journey.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '1234567890'
      VITE_FIREBASE_APP_ID: '1:1234567890:web:journey'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact shared-file integration
        run: node .github/journey-bootstrap.mjs
      - name: Install locked dependencies
        run: npm ci && npm ci --prefix functions
      - name: Lint and compile application
        run: npm run lint && npm run build
      - name: Compile and verify backend boundaries
        run: npm run build --prefix functions && npm test --prefix functions -- --runInBand
      - name: Save verified integration to this feature branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/customer-journey-hig'
          rm .github/journey-bootstrap.mjs .github/workflows/journey-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src functions/src tests scripts .github/journey-bootstrap.mjs .github/workflows/journey-bootstrap.yml
          git commit -m 'feat: integrate verified customer journey, canonical billing and setup guidance'
          git push origin HEAD:feat/customer-journey-hig
      - name: Retain diagnostics
        if: always()
        run: git diff > /tmp/journey-integration.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-integration-diagnostics
          path: /tmp/journey-integration.diff
          retention-days: 7
