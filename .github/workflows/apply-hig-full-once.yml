name: Apply expanded HIG remediation
on:
  push:
    branches: [recovery/local-v2]
    paths: ['.github/workflows/apply-hig-full-once.yml']
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify and apply exact source edits
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.github/hig-full-recipe/part{i}').read_text().strip() for i in range(1, 4))
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'd1d9abb0bf8851087b26242460aecad9f7072ec98c86df22b851b8b28393d477', 'Recipe integrity mismatch'
          recipe = json.loads(lzma.decompress(packed))
          outputs = []
          for entry in recipe['files']:
              path = Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('src', 'tests', 'docs') and not path.is_symlink()
              old = path.read_bytes() if path.exists() else b''
              if entry['before'] is None:
                  assert not path.exists(), f'Unexpected file: {path}'
              else:
                  assert hashlib.sha256(old).hexdigest() == entry['before'], f'Source changed: {path}'
              text = old.decode('utf-8')
              for edit in reversed(entry['edits']):
                  assert 0 <= edit['start'] <= edit['end'] <= len(text)
                  text = text[:edit['start']] + edit['text'] + text[edit['end']:]
              result = text.encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == entry['after'], f'Result mismatch: {path}'
              outputs.append((path, result))
          for path, result in outputs:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
              print(f'Applied: {path}')
          PY
      - name: Install locked application and test dependencies
        run: |
          npm ci
          npm ci --prefix tests/hig
      - name: Verify lint, TypeScript and production compilation
        run: |
          npm run lint
          npm run build
          git diff --check
      - name: Commit verified changes to recovery branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/recovery/local-v2'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests/hig
          git commit -m 'Extend Apple HIG accessibility and recovery across account workflows and tile inspectors'
          git push origin HEAD:refs/heads/recovery/local-v2
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install isolated Chromium and WebKit
        working-directory: tests/hig
        run: npx playwright install --with-deps chromium webkit
      - name: Test real interfaces with synthetic services
        working-directory: tests/hig
        run: npm test -- --max-failures=12
      - name: Retain screenshots and audit traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hig-expanded-verification
          path: |
            tests/hig/report
            tests/hig/results
          retention-days: 7
