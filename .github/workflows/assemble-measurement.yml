name: Measurement source integration
on:
  push:
    branches: [feat/first-party-measurement]
    paths:
      - 'scripts/assemble-measurement.mjs'
      - '.github/workflows/assemble-measurement.yml'
permissions:
  contents: write
concurrency:
  group: measurement-source-assembly
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'AccelAnalysis/AccelRestaurants_V2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_TARGET: ci
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: ci.invalid
      VITE_FIREBASE_PROJECT_ID: ci-placeholder
      VITE_FIREBASE_STORAGE_BUCKET: ci.invalid
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:ci'
      VITE_FIREBASE_MEASUREMENT_ID: G-CI00000000
      VITE_FINNHUB_API_KEY: ci-placeholder
      VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/first-party-measurement
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Integrate inspected source anchors
        run: node scripts/assemble-measurement.mjs
      - name: Commit source changes and remove one-shot assembler
        run: |
          rm scripts/assemble-measurement.mjs .github/workflows/assemble-measurement.yml
          git config user.name 'AccelRestaurants Measurement Build'
          git config user.email 'measurement-build@users.noreply.github.com'
          git add src functions firebase.json firestore.rules firestore.indexes.json vite.config.ts scripts .github/workflows
          git commit -m 'feat: integrate first-party measurement into Firebase player and dashboards'
          git pull --rebase origin feat/first-party-measurement
          git push origin HEAD:feat/first-party-measurement
      - name: Install locked dependencies
        run: npm ci && npm ci --prefix functions
      - name: Frontend lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Frontend production build
        id: frontend
        continue-on-error: true
        run: npm run build
      - name: Functions build
        id: backend
        continue-on-error: true
        run: npm run build --prefix functions
      - name: Functions tests
        id: tests
        continue-on-error: true
        run: npm test --prefix functions -- --runInBand
      - name: Report build outcome
        if: always()
        run: |
          echo 'lint=${{ steps.lint.outcome }} frontend=${{ steps.frontend.outcome }} backend=${{ steps.backend.outcome }} tests=${{ steps.tests.outcome }}'
          test '${{ steps.lint.outcome }}' = success && test '${{ steps.frontend.outcome }}' = success && test '${{ steps.backend.outcome }}' = success && test '${{ steps.tests.outcome }}' = success
