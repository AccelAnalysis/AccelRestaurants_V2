name: HIG full review workspace
on:
  push:
    branches: [recovery/local-v2]
    paths: ['.github/workflows/hig-full-workspace.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output="$RUNNER_TEMP/hig-full-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: hig-full-source
          path: ${{ runner.temp }}/hig-full-source.tar.gz
          retention-days: 1
