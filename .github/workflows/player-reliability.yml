name: Player reliability validation
on:
  push:
    branches: [feat/player-operational-trustworthiness]
permissions:
  contents: read
jobs:
  verify-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          mkdir -p /tmp/player-transfer
          cp .github/player-part-*.txt /tmp/player-transfer/
          git ls-tree HEAD .github/player-part-*.txt > /tmp/player-transfer/blobs.txt
          git fetch origin feat/cinematic-productization
          git rev-parse origin/feat/cinematic-productization > /tmp/player-transfer/cinematic.sha
          git diff --binary 5445cf016ba8c18f31a2837fcbfd9848fb147cd2...origin/feat/cinematic-productization > /tmp/player-transfer/cinematic.patch
      - uses: actions/upload-artifact@v4
        with:
          name: player-transfer-check
          path: /tmp/player-transfer
          retention-days: 1
