name: Stabilize measurement source
on:
  push:
    branches: [feat/first-party-measurement]
    paths: ['scripts/stabilize-measurement.mjs', '.github/workflows/stabilize-measurement.yml']
permissions:
  contents: write
concurrency:
  group: measurement-source-assembly
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'AccelAnalysis/AccelRestaurants_V2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/first-party-measurement
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply exact source corrections
        run: node scripts/stabilize-measurement.mjs
      - name: Commit source and remove one-shot helper
        run: |
          rm scripts/stabilize-measurement.mjs .github/workflows/stabilize-measurement.yml
          git config user.name 'AccelRestaurants Measurement Build'
          git config user.email 'measurement-build@users.noreply.github.com'
          git add src functions tests/measurement scripts .github/workflows/stabilize-measurement.yml
          git commit -m 'fix: preserve authenticated player identity across reloads and protect aggregate replay'
          git pull --rebase origin feat/first-party-measurement
          git push origin HEAD:feat/first-party-measurement
