name: Complete customer journey integration
on:
  push:
    branches: [feat/customer-journey-hig]
    paths: [.github/journey-refine.mjs, .github/workflows/journey-refine.yml]
permissions:
  contents: write
concurrency:
  group: customer-journey-refine
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/customer-journey-hig'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: demo-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-accel-journey.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-accel-journey
      VITE_FIREBASE_STORAGE_BUCKET: demo-accel-journey.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '1234567890'
      VITE_FIREBASE_APP_ID: '1:1234567890:web:journey'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: node .github/journey-refine.mjs
      - run: npm ci && npm ci --prefix functions
      - run: npm run lint && npm run build && npm run build --prefix functions && npm test --prefix functions -- --runInBand
      - name: Save verified integration on isolated feature branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/customer-journey-hig'
          rm .github/journey-refine.mjs .github/workflows/journey-refine.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github
          git commit -m 'fix: preserve screen setup navigation and use customer language throughout guest reporting'
          git push origin HEAD:feat/customer-journey-hig
