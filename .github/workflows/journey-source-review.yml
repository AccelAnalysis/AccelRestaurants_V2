name: Customer journey source review snapshot
on:
  push:
    branches: [feat/customer-journey-hig]
    paths: [.github/workflows/journey-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Archive reviewed source only
        run: |
          mkdir -p /tmp/journey-source
          git archive --format=zip HEAD -o /tmp/journey-source/customer-journey.zip
          git fetch origin feat/player-activation-persistence --depth=1
          git archive --format=zip FETCH_HEAD -o /tmp/journey-source/player-activation.zip
      - uses: actions/upload-artifact@v4
        with:
          name: customer-journey-source-review
          path: /tmp/journey-source
          retention-days: 1
