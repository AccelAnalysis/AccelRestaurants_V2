name: Apply Firebase audio correction

on:
  push:
    branches:
      - recovery/local-v2
    paths:
      - .github/patches/apply_firebase_audio_experience.py
      - .github/workflows/apply-firebase-audio-experience.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Firebase audio integration
        run: python .github/patches/apply_firebase_audio_experience.py

      - name: Normalize generated React and media details
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          plane = Path('src/components/atoms/GlobalMediaPlane.tsx')
          text = plane.read_text()
          text = text.replace(
              "export const GlobalMediaPlane = ({ screen, location }: GlobalMediaPlaneProps) => {\n  const config = normalizeScreenAudioConfig(screen.audioConfig);",
              "export const GlobalMediaPlane = ({ screen, location }: GlobalMediaPlaneProps) => {\n  const config = useMemo(() => normalizeScreenAudioConfig(screen.audioConfig), [screen.audioConfig]);"
          )
          text = text.replace("  }, [screen.id, screen.audioConfig]);", "  }, [config]);")
          text = re.sub(
              r"  useEffect\(\(\) => \{\n    if \(!location\?\.id\) \{\n      setLocationSync\(null\);\n      return;\n    \}\n    return AudioService\.subscribeToLocationAudio\(location\.id, setLocationSync\);\n  \}, \[location\?\.id\]\);",
              "  useEffect(() => {\n    if (!location?.id) return;\n    return AudioService.subscribeToLocationAudio(location.id, setLocationSync);\n  }, [location?.id]);",
              text,
              count=1,
          )
          text = re.sub(
              r"  useEffect\(\(\) => \{\n    if \(currentIndex >= tracks\.length\) setCurrentIndex\(0\);\n    setNextIndex\(null\);\n    setCrossfadeProgress\(0\);\n  \}, \[tracks\.length, currentIndex\]\);",
              "  useEffect(() => {\n    const reset = window.setTimeout(() => {\n      if (currentIndex >= tracks.length) setCurrentIndex(0);\n      setNextIndex(null);\n      setCrossfadeProgress(0);\n    }, 0);\n    return () => window.clearTimeout(reset);\n  }, [tracks.length, currentIndex]);",
              text,
              count=1,
          )
          text = text.replace("    media.playsInline = true;\n", "")
          plane.write_text(text)

          tile = Path('src/components/atoms/TileContent.tsx')
          text = tile.read_text().replace("    else { audio.pause(); setStatus('idle'); }", "    else { audio.pause(); }")
          text = text.replace("<Volume2 size={28}", "<Volume size={28}")
          tile.write_text(text)
          PY

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend production build
        run: npm run build

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Functions build
        run: npm run build
        working-directory: functions

      - name: Functions tests
        run: npm test -- --runInBand
        working-directory: functions

      - name: Commit validated Firebase audio integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patches/apply_firebase_audio_experience.py .github/workflows/apply-firebase-audio-experience.yml
          git add -A
          git commit -m "feat: implement Firebase cinematic audio experience"
          git push origin HEAD:recovery/local-v2
