name: Cinematic validation
on:
  push:
    branches: [feat/cinematic-productization]
    paths: [.github/workflows/cinematic-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Package isolated integration workspace
        run: tar --exclude=.git --exclude=node_modules/.cache -czf /tmp/cinematic-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: cinematic-workspace
          path: /tmp/cinematic-workspace.tar.gz
          retention-days: 1
