name: HIG UI checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/hig/**'
      - 'package*.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/hig-ui-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/hig/**'
      - 'package*.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/hig-ui-tests.yml'

permissions:
  contents: read

concurrency:
  group: hig-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hig-ui:
    name: Keyboard, touch and accessibility (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            engine: chromium
          - project: phone-chromium
            engine: chromium
          - project: tablet-webkit
            engine: webkit
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/hig/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix tests/hig
      - name: Install browser engine
        working-directory: tests/hig
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: npx playwright install --with-deps "$BROWSER_ENGINE"
      - name: Verify real UI with isolated synthetic services
        working-directory: tests/hig
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
        run: npm test -- --project="$BROWSER_PROJECT"
      - name: Retain screenshots and failure traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hig-ui-results-${{ matrix.project }}
          path: |
            tests/hig/report
            tests/hig/results
          retention-days: 7
