name: HIG verification

on:
  push:
    branches: [recovery/local-v2]
    paths: ['.github/workflows/hig-verification.yml']

permissions:
  contents: read

jobs:
  review-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export dependencies for network-isolated UI testing
        run: |
          npm install --prefix /tmp/hig-tools --no-audit --no-fund --ignore-scripts @playwright/test@1.55.1 @axe-core/playwright@4.10.2
          cp -R /tmp/hig-tools/node_modules/@playwright node_modules/
          cp -R /tmp/hig-tools/node_modules/playwright node_modules/
          cp -R /tmp/hig-tools/node_modules/playwright-core node_modules/
          cp -R /tmp/hig-tools/node_modules/@axe-core node_modules/
          cp -R /tmp/hig-tools/node_modules/axe-core node_modules/
          tar -czf "$RUNNER_TEMP/hig-dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: hig-review-dependencies
          path: ${{ runner.temp }}/hig-dependencies.tar.gz
          retention-days: 1
