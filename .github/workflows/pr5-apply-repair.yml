name: Prepare reviewed PR5 repair
on:
  push:
    branches: [feat/customer-journey-hig]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'AccelAnalysis/AccelRestaurants_V2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDIT_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Verify and apply exact reviewed bytes
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = cc10197cb6ef0e45c6bf9ca6242679f273394707
          git merge-base --is-ancestor dbb9b0cbb42f223aaab828adbb03447ca11a0a5e origin/main
          python3 - <<'PY'
          import base64, lzma, hashlib, pathlib
          encoded = ''.join(pathlib.Path(f'.github/pr5-repair-{n}.b64').read_text().strip() for n in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0c10eaefc26be9f6e82c068ed63dc093ce279f8b841f3cc6b8777652fad4e18a', 'Payload checksum mismatch'
          pathlib.Path('/tmp/pr5-repair.patch').write_bytes(patch)
          PY
          git reset --hard 1764cdb582811d4c2fe91466a2bcced920697108
          python3 - <<'PY'
          import subprocess
          main = 'dbb9b0cbb42f223aaab828adbb03447ca11a0a5e'
          changes = subprocess.check_output(['git','diff','--name-status','16539a2837678d9b679e0ff33cf39d75e2afdb1f',main], text=True)
          for line in changes.splitlines():
              status, name = line.split('\t')
              subprocess.run(['git','rm','--',name] if status == 'D' else ['git','checkout',main,'--',name], check=True)
          PY
          git apply --index --unidiff-zero /tmp/pr5-repair.patch
          test "$(git write-tree)" = 66e6c5bd19d05ec8e4425ed23f956b9a5628b137
      - name: Test candidate before publishing any feature ref
        run: |
          npm ci
          npm ci --prefix functions
          npm run lint
          npx tsc -b
          node --test tests/journey/*.test.mjs
          npm run build --prefix functions
          npm test --prefix functions -- --runInBand
          git diff --exit-code
      - name: Create candidate on isolated scratch ref only
        run: |
          test "$(git ls-remote origin refs/heads/feat/customer-journey-hig | cut -f1)" = "$AUDIT_HEAD"
          test "$(git write-tree)" = 66e6c5bd19d05ec8e4425ed23f956b9a5628b137
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sha=$(printf '%s\n' 'fix(journey): restore regressions and integrate merged PR4 with real service verification' | git commit-tree "$(git write-tree)" -p "$AUDIT_HEAD" -p dbb9b0cbb42f223aaab828adbb03447ca11a0a5e)
          git push origin "$sha:refs/heads/work/pr5-regression-repair"
          mkdir -p /tmp/repair-evidence
          printf '%s\n' "$sha" > /tmp/repair-evidence/candidate-head.txt
          printf '%s\n' "$AUDIT_HEAD" > /tmp/repair-evidence/parent-head.txt
          git diff --stat dbb9b0cbb42f223aaab828adbb03447ca11a0a5e "$sha" > /tmp/repair-evidence/change-stat.txt
          echo "Candidate repair: $sha. PR5/main not advanced by this workflow." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pr5-prepared-repair
          path: /tmp/repair-evidence
          retention-days: 3
