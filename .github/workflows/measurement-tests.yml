name: Measurement verification
on:
  pull_request:
    paths: ['src/**', 'functions/**', 'tests/measurement/**', 'firebase.json', 'firestore.*', 'vite.config.ts', '.github/workflows/measurement-tests.yml']
  push:
    branches: [main]
    paths: ['src/**', 'functions/**', 'tests/measurement/**', 'firebase.json', 'firestore.*', 'vite.config.ts', '.github/workflows/measurement-tests.yml']
permissions:
  contents: read
concurrency:
  group: measurement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  measurement:
    name: Measurement contracts, emulator transactions and browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      DEPLOY_TARGET: ci
      VITE_USE_EMULATORS: 'true'
      VITE_FIREBASE_API_KEY: demo-measurement-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-accel-measurement.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-accel-measurement
      VITE_FIREBASE_STORAGE_BUCKET: demo-accel-measurement.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:measurement'
      VITE_FIREBASE_MEASUREMENT_ID: G-TEST000000
      VITE_FINNHUB_API_KEY: emulator-unused
      VITE_STRIPE_PUBLISHABLE_KEY: pk_test_emulator_unused
      MEASUREMENT_ORIGIN: http://127.0.0.1:5000
      MEASUREMENT_REQUIRE_APP_CHECK: 'false'
      GCLOUD_PROJECT: demo-accel-measurement
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            tests/hig/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked application and test dependencies
        run: |
          npm ci
          npm ci --prefix functions
          npm ci --prefix tests/hig
          npm install --global firebase-tools@15.29.0
          cd tests/hig && npx playwright install --with-deps chromium
      - name: Validate and lint source
        run: npm run validate:env && npm run lint
      - name: Build production frontend and Functions
        run: npm run build && npm run build --prefix functions
      - name: Run contract and existing Functions tests
        run: npm test --prefix functions -- --runInBand
      - name: Verify security rules and transactional measurement with Firestore emulator
        run: firebase emulators:exec --project demo-accel-measurement --only firestore 'npm test --prefix functions -- --runInBand --testPathPatterns=measurement/engine.integration.test.ts --testTimeout=30000'
      - name: Configure isolated Functions parameters
        run: |
          printf 'MEASUREMENT_ORIGIN=http://127.0.0.1:5000\nMEASUREMENT_REQUIRE_APP_CHECK=false\n' > functions/.env.demo-accel-measurement
      - name: Browser and automatic event-pipeline verification against real Firebase emulators
        run: firebase emulators:exec --project demo-accel-measurement --only auth,firestore,functions,hosting,storage 'node tests/measurement/browser.mjs && node tests/measurement/trigger.mjs'
      - name: Retain browser evidence and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement-verification-${{ github.run_id }}
          path: |
            tests/measurement/results
            *-debug.log
            ui-debug.log
          retention-days: 7
