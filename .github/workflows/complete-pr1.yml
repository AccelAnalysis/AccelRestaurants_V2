name: Complete PR 1 blockers

on:
  push:
    branches:
      - recovery/local-v2
    paths:
      - .github/workflows/complete-pr1.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/local-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Apply fixes
        run: |
          python3 scripts/complete_pr1.py
          python3 scripts/complete_pr1_followup.py

      - name: Validate frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate Functions
        run: |
          npm ci --prefix functions
          npm run build --prefix functions
          npm test --prefix functions -- --runInBand

      - name: Commit validated fixes
        run: |
          rm .github/workflows/complete-pr1.yml scripts/complete_pr1.py scripts/complete_pr1_followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close PR 1 security and accessibility blockers"
          git push origin HEAD:recovery/local-v2
