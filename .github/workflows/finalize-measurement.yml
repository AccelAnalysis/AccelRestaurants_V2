name: Finalize measurement source
on:
  push:
    branches: [feat/first-party-measurement]
    paths: ['scripts/finalize-measurement.mjs', '.github/workflows/finalize-measurement.yml']
permissions:
  contents: write
concurrency:
  group: measurement-source-assembly
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'AccelAnalysis/AccelRestaurants_V2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/first-party-measurement
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply exact source edits
        run: node scripts/finalize-measurement.mjs
      - name: Commit changes and remove this one-shot helper
        run: |
          rm scripts/finalize-measurement.mjs .github/workflows/finalize-measurement.yml
          git config user.name 'AccelRestaurants Measurement Build'
          git config user.email 'measurement-build@users.noreply.github.com'
          git add src functions firebase.json firestore.rules vite.config.ts tests/measurement .github/workflows scripts
          git commit -m 'fix: verify mobile interactions and align measurement runtime and device authorization'
          git pull --rebase origin feat/first-party-measurement
          git push origin HEAD:feat/first-party-measurement
