name: CI and Firebase Preview

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: ci
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: ci.invalid
      VITE_FIREBASE_PROJECT_ID: ci-placeholder
      VITE_FIREBASE_STORAGE_BUCKET: ci.invalid
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:ci'
      VITE_FIREBASE_MEASUREMENT_ID: G-CI00000000
      VITE_FINNHUB_API_KEY: ci-placeholder
      VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate explicit Vite configuration
        run: npm run validate:env
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  functions:
    name: Functions CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        run: npm ci
      - name: Build Functions
        run: npm run build
      - name: Run Functions unit tests
        run: npm test -- --runInBand

  preview:
    name: Firebase PR Preview (same project)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - frontend
      - functions
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      DEPLOY_TARGET: staging
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FINNHUB_API_KEY: ${{ vars.VITE_FINNHUB_API_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Validate preview Firebase target and service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm run validate:env
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo '::error::The staging GitHub environment is missing FIREBASE_PROJECT_ID.'
            exit 1
          fi
          if [ "$FIREBASE_PROJECT_ID" != 'accelrestaurant-d2c1f' ]; then
            echo '::error::Preview FIREBASE_PROJECT_ID must be accelrestaurant-d2c1f.'
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::The staging GitHub environment is missing the FIREBASE_SERVICE_ACCOUNT secret.'
            exit 1
          fi
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Firebase Hosting preview
        run: npm run build
      - name: Deploy Firebase Hosting preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 14d
