name: Apply and verify HIG remediation

on:
  push:
    branches: [recovery/local-v2]
    paths: ['.github/workflows/apply-hig-once.yml']

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.repository == 'AccelAnalysis/AccelRestaurants_V2' && github.ref == 'refs/heads/recovery/local-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Verify and apply exact reviewed source edits
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.github/hig-recipe/part{i}').read_text().strip() for i in range(1, 5))
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'c2dfb6d935432c565e6cc14a484221a6abfe2c75c63ab3c1969b0c5ed2f22d64', 'Recipe integrity check failed'
          recipe = json.loads(lzma.decompress(packed))
          outputs = []
          for entry in recipe['files']:
              path = Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert str(path) == '.gitignore' or path.parts[0] in ('src', 'docs', 'tests')
              assert not path.is_symlink()
              old = path.read_bytes() if path.exists() else b''
              if entry['before'] is None:
                  assert not path.exists(), f'Unexpected existing file: {path}'
              else:
                  assert hashlib.sha256(old).hexdigest() == entry['before'], f'Source changed: {path}'
              text = old.decode('utf-8')
              for edit in reversed(entry['edits']):
                  assert 0 <= edit['start'] <= edit['end'] <= len(text)
                  text = text[:edit['start']] + edit['text'] + text[edit['end']:]
              result = text.encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == entry['after'], f'Result mismatch: {path}'
              outputs.append((path, result))
          for path, result in outputs:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
              print(f'Applied verified edits: {path}')
          PY
      - name: Install application and isolated test dependencies
        run: |
          npm ci
          npm install --prefix tests/hig --no-audit --no-fund
      - name: Verify frontend lint and production compilation
        run: |
          npm run lint
          npm run build
          git diff --check
      - name: Commit verified remediation to recovery branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src docs tests/hig .gitignore
          git commit -m 'Apply focused Apple HIG remediation with isolated UI regression coverage'
          git push origin HEAD:refs/heads/recovery/local-v2
          echo "Verified source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install isolated browser engines
        working-directory: tests/hig
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise real components with synthetic services
        working-directory: tests/hig
        run: npm test -- --max-failures=6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hig-browser-verification
          path: |
            tests/hig/report
            tests/hig/results
            tests/hig/package-lock.json
          retention-days: 7
